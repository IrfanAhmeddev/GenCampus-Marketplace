<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seller Dashboard | GenCampus Marketplace</title>

<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<!-- Overlay -->

<div id="overlay" class="gc-overlay"></div>

<header class="gc-header">

<div class="gc-container">

<div class="gc-dashboard-top">

<div>

<h1>Seller Dashboard</h1>

<p>Manage your marketplace listings</p>

</div>

<div class="gc-dashboard-actions">

<div class="gc-search">

<input
type="text"
id="searchInput"
placeholder="Search your products...">

</div>

<button
id="requestBtn"
class="gc-icon-btn">

🔔

<span class="gc-badge">

3

</span>

</button>

<button
id="purchaseBtn"
class="gc-icon-btn">

🛒

<span class="gc-badge">

2

</span>

</button>

<a
href="sell.html"
class="gc-btn gc-btn-primary">

+ Add Product

</a>

</div>

</div>

</div>

</header>

<main class="gc-container">

<section class="gc-stats">

<div class="gc-stat-card">

<h2 id="totalProducts">

0

</h2>

<p>Total Products</p>

</div>

<div class="gc-stat-card">

<h2 id="availableProducts">

0

</h2>

<p>Available</p>

</div>

<div class="gc-stat-card">

<h2 id="soldProducts">

0

</h2>

<p>Sold</p>

</div>

</section>

<section class="gc-card">

<table class="gc-table">

<thead>

<tr>

<th>Image</th>

<th>Title</th>

<th>Price</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="dashboardTable">

</tbody>

</table>

</section>

</main>

<!-- ========================= -->
<!-- RIGHT DRAWER -->
<!-- ========================= -->

<aside
id="sideDrawer"
class="gc-side-drawer">

<div class="gc-drawer-header">

<h2 id="drawerTitle">

Notifications

</h2>

<button
id="closeDrawer">

✕

</button>

</div>

<div
id="drawerContent"
class="gc-drawer-content">

</div>

</aside>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>

</body>

</html>
