<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | GenCampus Marketplace</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/sell.css">

</head>

<body>

<header class="gc-header">

    <div class="gc-container gc-flex-between">

        <div>

            <h1>Edit Product</h1>

            <p>Update your marketplace listing</p>

        </div>

        <a href="dashboard.html"
           class="gc-btn gc-btn-secondary">

            ← Dashboard

        </a>

    </div>

</header>

<main class="gc-container">

<form id="editProductForm"
      class="gc-sell-form">

<input type="hidden"
       id="productId">

<div class="gc-form-group">

<label>Current Product Image</label>

<img
id="imagePreview"
src="https://via.placeholder.com/300x220"
class="gc-image-preview">

</div>

<div class="gc-form-group">

<label>Replace Image</label>

<input
type="file"
id="productImage"
accept="image/*">

</div>

<div class="gc-form-group">

<label>Product Name</label>

<input
type="text"
id="title"
required>

</div>

<div class="gc-form-group">

<label>Category</label>

<select id="category">

<option>Books</option>

<option>Electronics</option>

<option>Furniture</option>

<option>Accessories</option>

</select>

</div>

<div class="gc-form-group">

<label>Price (₹)</label>

<input
type="number"
id="price"
required>

</div>

<div class="gc-form-group">

<label>Condition</label>

<select id="condition">

<option>New</option>

<option>Like New</option>

<option>Good</option>

<option>Fair</option>

</select>

</div>

<div class="gc-form-group">

<label>Description</label>

<textarea
id="description"
rows="5"></textarea>

</div>

<div class="gc-form-group">

<label>Location</label>

<input
type="text"
id="location">

</div>

<div class="gc-action-buttons">

<button
type="submit"
class="gc-btn gc-btn-primary">

Update Product

</button>

<a
href="dashboard.html"
class="gc-btn gc-btn-secondary">

Cancel

</a>

</div>

</form>

</main>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/edit-product.js"></script>

</body>

</html>
